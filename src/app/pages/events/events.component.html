<section class="page-hero">
  <div class="container">
    <span class="eyebrow">Events</span>
    <h1>Programmes</h1>
    </div>
</section>

<section class="section">
  <div class="container">
    <p class="placeholder-note">Programme Schedules are indicative until confirmed by the Chapter Office.</p>

    <div class="filters">
      <button class="filter-btn" [class.is-active]="filter === 'Upcoming'" (click)="setFilter('Upcoming')">Upcoming</button>
      <button class="filter-btn" [class.is-active]="filter === 'Past'" (click)="setFilter('Past')">Past</button>
      <button class="filter-btn" [class.is-active]="filter === 'All'" (click)="setFilter('All')">All</button>
    </div>

    <div class="event-list">
      <article class="event-row card" *ngFor="let e of filtered">
        <div class="event-row__date">
          <span class="tag" [ngClass]="'tag--' + e.mode.toLowerCase().replace('-', '')">{{ e.mode }}</span>
          <p>{{ e.date }}</p>
        </div>
        <div class="event-row__body">
          <h3>{{ e.title }}</h3>
          <p class="event-row__venue" *ngIf="e.venue">{{ e.venue }}</p>
          <p>{{ e.description }}</p>
        </div>
        <div class="event-row__status" [class.is-past]="e.status === 'Past'">
          {{ e.status }}
        </div>
      </article>

      <p *ngIf="!filtered.length" class="empty-state">No events in this view yet.</p>
    </div>
  </div>
</section>
