<section class="page-hero">
  <div class="container">
    <span class="eyebrow">Gallery</span>
    <h1>ISTD Bangalore Chapter Moments</h1>
    <p class="page-hero__sub">Photographs from Chapter meets, diploma convocations, and the Southern Regional Conference.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="gallery-grid">
      <figure class="gallery-item card" *ngFor="let g of gallery">
        <div class="gallery-item__image" *ngIf="g.imageUrl">
          <img [src]="g.imageUrl" [alt]="g.caption" />
        </div>
        <div class="gallery-item__placeholder" *ngIf="!g.imageUrl" aria-hidden="true">
          <span>ISTD</span>
        </div>
        <figcaption>{{ g.caption }}</figcaption>
      </figure>
    </div>
  </div>
</section>
