<section class="page-hero">
  <div class="container">
    <span class="eyebrow">Moments</span>
    <h1>Gallery</h1>
    <p class="page-hero__sub">Photos from chapter meets, diploma convocations, and the Southern Region Conference.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <p class="placeholder-note">⚠ No photos uploaded yet — upload event photos and I'll wire them into this grid in place of the placeholders below.</p>

    <div class="gallery-grid">
      <figure class="gallery-item card" *ngFor="let g of gallery">
        <div class="gallery-item__image" *ngIf="g.imageUrl">
          <img [src]="g.imageUrl" [alt]="g.caption" />
        </div>
        <div class="gallery-item__placeholder" *ngIf="!g.imageUrl" aria-hidden="true">
          <span>ISTD</span>
        </div>
        <figcaption>{{ g.caption }}</figcaption>
      </figure>
    </div>
  </div>
</section>
